# Reusable release build (spec 15.3 `release`), called only by release.yml.
# M9 (owner, 2026-11-16): signing is GitHub artifact attestations (Sigstore,
# keyless), aiming at SLSA v1.0 Build Level 3. The build and the signing both
# run here, in a reusable workflow, so the attestation's signer identity is
# this file and not the calling workflow; users verify with
#   gh attestation verify <file> --repo TheDansmod/password_manager \
#     --signer-workflow TheDansmod/password_manager/.github/workflows/release-build.yml
# No key exists to look after. Only tag builds are attested; the per-push
# `release-check` job in ci.yml runs the same script without signing.
name: release-build

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    # Provisional cap 30 until measured (three release builds).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation in the repository
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The file names come from Cargo.toml's version, not from the tag, so
      # a tag that disagrees would attest files under the wrong version
      # (owner, 2026-11-18). Only tag builds are checked; nothing else
      # calls this workflow, and ci.yml's `release-check` never runs it.
      - name: Tag matches Cargo.toml's version
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "::error::tag '$TAG' does not match Cargo.toml's version '$version' (expected tag 'v$version')"
            exit 1
          fi
          echo "tag $TAG matches version $version"
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: T-REPRO-1, T-ENG-7, hardening; binary, licence, SHA256SUMS
        run: sh scripts/release_build.sh dist
      - name: Attest build provenance (signs the binary, both licences, and SHA256SUMS)
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/pwv-*
            dist/SHA256SUMS
      - name: Ship the Sigstore bundle with the files
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/pwv.sigstore.json
      - uses: actions/upload-artifact@v6
        with:
          name: pwv-release-${{ github.ref_name }}
          path: dist/
          retention-days: 90
