# CI for pwv (spec Section 15.3). M0: `lint`, `supply`. M1: `test`,
# `coredump` (T-MEM-5's coredumpctl clause). M2: `fuzz-smoke`, `sanitizers`
# (Miri on format), testkdf test build. M3: crypto and lifecycle tests in
# `test`, `compat` (golden vaults checked by an independent implementation),
# T-FUZZ-3 in `fuzz-smoke`, Miri on crypto and vault in `sanitizers`.
# M4: storage tests in `test` (T-STORE-1 .. T-STORE-7, T-STORE-9; T-STORE-2
# is a lib unit test), a vfat loop mount for T-STORE-1's foreign-filesystem
# refusal, and `durability` (T-STORE-3 at 5,000 iterations; LazyFS for
# T-STORE-8 joins it in M9).
# M5: model tests in `test` (T-VAULT-1, T-VAULT-2, tests/vault.rs, every
# configuration), T-FUZZ-6 (`fuzz_import`) in `fuzz-smoke`, Miri on the
# model in `sanitizers`.
# M6: generator tests in `test` (T-GEN-1 .. T-GEN-6, tests/gen.rs, every
# configuration, plus an "M6 gate by name" step), Miri on `gen` in
# `sanitizers` (eight jobs since M6 CI round 2), and the cfg(miri)
# compile check of tests/gen.rs.
# M7: `e2e` (T-E2E-1 .. T-E2E-12 on a PTY, T-CLIP-1 .. T-CLIP-4 under
# `xvfb-run` with `xclip`, plus an "M7 gate by name" step), the pure
# cli/term tests (tests/cli.rs) and the PTY tests in every `test`
# configuration (there the clipboard tests return at once: no display),
# and T-FUZZ-4 (`fuzz_tokenizer`), T-FUZZ-5 (`fuzz_sanitize`) in
# `fuzz-smoke`. The `strength` feature and `zxcvbn` are gone (DESIGN_NOTES,
# M7).
# M8: in `e2e`, T-MEM-4 (tests/mem.rs, memtest build, canary scan through
# /proc/<pid>/mem, under xvfb-run so the clipboard exception is exercised)
# and T-MIG-1 .. T-MIG-3 plus T-E2E-10's real pipe (tests/mig.rs) with the
# real gpg and a fixture written by the original encrypted_pw_mgr.py
# (PWV_REQUIRE_GPG makes that mandatory), plus an "M8 gate by name" step.
# In `test`, both files run in every configuration (mem.rs only does
# something in memtest builds; mig.rs uses its stand-in gpg there).
# M9 (round 1): pushes run everything except the nightly jobs (Miri
# `sanitizers`, `sanitizers-asan` = T-SAN-1, `durability`, `test-arm64`),
# which run nightly and on "Run workflow" (owner, 2026-11-16). New:
# `release-check` (T-REPRO-1, T-ENG-7, link hardening; every push), the
# tag-triggered release.yml / release-build.yml (attested artefacts),
# `sanitizers-asan` (T-SAN-1), `test-arm64` (spec 15.3's aarch64 runner),
# an "M1-M3 gate by name" step checked against `test`'s kept logs, and the
# Section 14 inventory check in `lint` (scripts/test_ids.py).
# M9 (round 2): `coverage` (spec 14.13: five instrumented configurations,
# every push), `coverage-branch` (T-COV-5, nightly), `coverage-report`
# (merge, T-COV-1 .. T-COV-5, the job summary, artefacts, and the badges
# from runs on `main`: the only job with `contents: write`), `fuzz-long`
# (30 min per target, corpus kept, T-COV-6), `perf` (T-PERF-1, nightly),
# and T-STORE-8 (LazyFS) in `durability`. T-MUT-1 is the weekly
# workflow mutants.yml.
# M9 (first full run on `main`, 2026-11-17): `sanitizers-asan` accepts one
# named false report (LSan's ptrace self-test after an interrupted waitpid);
# `durability` builds LazyFS under CMake 4 and pins its commit.
# M9 (2026-11-18, owner): badges also from nightly and "Run workflow" runs
# on `main` (test IDs from full runs only); T-MUT-1 from mutants.yml's
# latest run.
# Runners are pinned to ubuntu-26.04 (moved from 24.04 on 2026-11-11 with
# no functional change in the same round). Each job's timeout-minutes is
# about 3x its runtime measured on ubuntu-26.04 (floor 10 min), so a stall
# fails fast; raise a cap only together with a measured runtime. Caps were
# last reset from the M6 CI round 3 and M7 CI round 1 timings, taking the
# slower of the two for each job (two raised after M7 CI round 2, five
# after M8 CI round 2): the same Miri job differed by up to 1.9x
# between those rounds (DESIGN_NOTES, M7 CI round 1).
# Exceptions near GitHub's 360 min job limit, where 3x does not fit, are
# capped at 350 and say so in their comment.
name: ci

# M9 (owner, 2026-11-16): pushes and pull requests run every job except
# the nightly ones; the nightly schedule and the manual "Run workflow"
# button (workflow_dispatch) run every job. Nightly-only jobs carry
# `if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}`.
# The definition of done (spec 16) is two consecutive green nightly runs.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly: every job (and `supply`'s new advisories)
  workflow_dispatch: # "run now": every job, as nightly

permissions:
  contents: read

# `bash -eo pipefail`: GitHub's default for steps without a `shell` is
# `bash -e`, under which `cargo test ... | tee log` takes the status of
# `tee` and a failing test passes its step (M8 CI round 1, DESIGN_NOTES).
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.23.0"
  TOKEI_VERSION: "15.0.0"
  CARGO_FUZZ_VERSION: "0.13.2"
  # M9, spec 14.13 (coverage jobs).
  CARGO_LLVM_COV_VERSION: "0.9.1"
  # M9, T-STORE-8. The LazyFS commit the first full run on `main` printed
  # (2026-11-17; its build then failed under CMake 4, fixed in
  # scripts/lazyfs.sh). Empty would mean LazyFS's default branch.
  LAZYFS_REF: "3edad01aa936b81fed9bd64e47e725fc5ef6c977"
  # `compat`: reference implementations for the independent golden check.
  PY_ARGON2_CFFI_VERSION: "23.1.0"
  PY_PYNACL_VERSION: "1.5.0"
  # M8, T-MIG-1: the legacy program's own imports, to write the fixture
  # with the original encrypted_pw_mgr.py (tests/legacy/make_fixture.py).
  PY_GNUPG_VERSION: "0.5.7"
  PY_RICH_VERSION: "15.0.0"
  PY_PYPERCLIP_VERSION: "1.11.0"

jobs:
  lint:
    # T-ENG-1 .. T-ENG-6 (T-ENG-5 compiles with the test suite from M1 on).
    # Measured 3m01 (M6 round 1).
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: T-ENG-1 rustfmt
        run: |
          cargo fmt --all --check
          (cd fuzz && cargo fmt --all --check)
      - name: T-ENG-1/T-ENG-4 clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: T-ENG-1/T-ENG-4 clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: T-ENG-1/T-ENG-4 clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: T-ENG-1/T-ENG-4 clippy (memtest)
        run: cargo clippy --locked --all-targets --features memtest -- -D warnings
      - name: T-ENG-1/T-ENG-4 clippy (testkdf)
        run: cargo clippy --locked --all-targets --features testkdf -- -D warnings
      - name: clippy (fuzz targets)
        working-directory: fuzz
        run: cargo clippy --locked --bins --features testkdf -- -D warnings
      - name: cfg(miri) heap backend compiles (Miri itself runs in `sanitizers`)
        run: |
          cargo rustc --locked --lib --profile check -- --cfg miri -D warnings
          cargo rustc --locked --lib --profile check --features memtest -- --cfg miri -D warnings
          cargo rustc --locked --test format --profile check --no-default-features -- --cfg miri -D warnings
          cargo rustc --locked --test crypto --profile check --no-default-features --features testkdf -- --cfg miri -D warnings
          cargo rustc --locked --test vault --profile check --no-default-features --features testkdf -- --cfg miri -D warnings
          cargo rustc --locked --test gen --profile check --no-default-features -- --cfg miri -D warnings
      - name: T-ENG-2, T-ENG-3, T-ENG-4 (source scanners)
        run: cargo test --locked --test eng
      - name: Install tokei
        run: cargo install --locked tokei --version "$TOKEI_VERSION"
      - name: T-ENG-6 LOC budget
        run: python3 -I scripts/loc_budget.py src
      - name: Section 14 test-ID inventory (every named test exists; M9)
        run: python3 -I scripts/test_ids.py --check
      - name: Coverage report and shared production-code rules self-tests (M9)
        run: |
          python3 -I scripts/coverage_report.py --self-test
          for f in scripts/*.sh; do sh -n "$f"; done

  test:
    # M1 gate: T-MEM-1, T-MEM-2, T-MEM-3, T-MEM-5 (release), T-MEM-6, T-ENG-5.
    # M2 gate: T-FMT-1 .. T-FMT-4. M3 gate: T-KAT-1, T-KAT-2, T-CRY-1 ..
    # T-CRY-6, T-COMPAT-1 (tests/crypto.rs), T-MEM-7 (tests/kdf_region.rs).
    # M4 gate (every configuration below): T-STORE-2 (fault injection, lib
    # unit test in src/store.rs), T-STORE-1, -3 (500 kills), -4, -5, -6, -7,
    # -9 (tests/store.rs), T-FMT-4 incl. the store read path
    # (tests/format_alloc.rs). Vaults live under $TMPDIR (the runner's ext4
    # root disk, so fsync is real); the source tree is never used.
    # Needs RLIMIT_MEMLOCK >= 2 MiB (GitHub runners: 8 MiB) and a non-root user
    # for T-MEM-5's ptrace / /proc/<pid>/mem refusal and for the RLIMIT_MEMLOCK
    # = 0 child of the --require-locked-kdf test.
    # Measured 48m00 (M6 round 1; M5 round 1 was 1h02m17; M6 round 3 was
    # 25m38; M8 round 2 was 49m39; M9 round 1 was 1h00m08): T-VAULT-1 runs
    # in all five configurations.
    # M7 round 1: the runner was lost ("lost communication with the
    # server") during the testkdf step, in tests/e2e.rs; the cause is not
    # established (DESIGN_NOTES, M7 CI round 1). Since then the five
    # configurations run under scripts/ci_guard.sh, which logs available
    # memory and load once a minute and kills a test process that exhausts
    # memory, so that a repeat leaves evidence in the log.
    # M9: each configuration's output is kept in logs/ (an artefact, for
    # the coverage report's test-ID table, spec 14.13 item 5), and the
    # IDs that no other step names are checked by name in those logs.
    runs-on: ubuntu-26.04
    timeout-minutes: 181
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p logs
      - name: Debug, default features (T-MEM-1, T-MEM-5 debug, T-MEM-6, T-ENG-5)
        run: sh scripts/ci_guard.sh cargo test --locked 2>&1 | tee logs/default.txt
      - name: Debug, memtest (T-MEM-2, T-MEM-3)
        run: sh scripts/ci_guard.sh cargo test --locked --features memtest 2>&1 | tee logs/memtest.txt
      - name: Release (T-MEM-5 against the release binary)
        run: sh scripts/ci_guard.sh cargo test --locked --release 2>&1 | tee logs/release.txt
      - name: Debug, testkdf (T-FMT-*; T-COMPAT-1 and T-CRY-1 on the golden vaults)
        run: sh scripts/ci_guard.sh cargo test --locked --features testkdf 2>&1 | tee logs/testkdf.txt
      - name: Debug, memtest + testkdf (T-MEM-7 zero-before-munmap on a locked region)
        run: sh scripts/ci_guard.sh cargo test --locked --features memtest,testkdf 2>&1 | tee logs/memtest-testkdf.txt
      - name: M1-M3 (and M9 T-COV-3) gate by name, from the logs above (M9; scripts/test_ids.py)
        # Every named test of these IDs must have an `ok` line in the five
        # configurations' logs and no `FAILED` line.
        run: >-
          python3 -I scripts/test_ids.py --require
          T-KAT-1,T-KAT-2,T-COMPAT-1,T-FMT-1,T-FMT-2,T-FMT-3,T-FMT-4,T-CRY-1,T-CRY-2,T-CRY-3,T-CRY-4,T-CRY-5,T-CRY-6,T-MEM-1,T-MEM-2,T-MEM-3,T-MEM-5,T-MEM-6,T-MEM-7,T-FUZZ-3,T-ENG-2,T-ENG-3,T-ENG-4,T-COV-3
          --logs logs/*.txt
      - name: M4 gate by name (T-STORE-1 .. T-STORE-7, T-STORE-9; one line each in the log)
        # The steps above already run these in every configuration; this
        # step lists each gate test by name and fails if one did not run.
        run: |
          cargo test --locked --lib store::tests 2>&1 | tee store.txt
          cargo test --locked --test store 2>&1 | tee -a store.txt
          for t in t_store_1_modes t_store_1_wrong_owner_via_uid_override \
              t_store_1_wrong_owner_root_directory t_store_1_symlinks_and_file_types \
              t_store_1_statfs_classifier t_store_2_crash_at_every_step \
              t_store_3_kill_loop t_store_4_second_process_refused \
              t_store_5_rollback_detected \
              t_store_5_state_never_regresses_and_tracks_vaults_separately \
              t_store_6_stale_temp_files_removed t_store_7_seven_saves_keep_five_backups \
              t_store_7_copy_fallback_without_hard_links \
              t_store_9_read_only_sessions_do_not_write; do
            grep -Eq "^test (store::tests::)?$t \.\.\. ok$" store.txt || { echo "missing: $t"; exit 1; }
          done
      - name: M5 gate by name (T-VAULT-1, T-VAULT-2; one line each in the log)
        # The steps above already run these in every configuration; this
        # step lists each gate test by name and fails if one did not run.
        # Release (built by the step above), so the list costs about a minute.
        run: |
          cargo test --locked --release --test vault 2>&1 | tee vault.txt
          for t in t_vault_1_model_matches_reference \
              t_vault_1_parts_cover_every_segment_once \
              t_vault_1_ci_ranges_cover_every_segment_once \
              t_vault_2_collisions_leave_model_and_file_identical \
              t_vault_2_random_models \
              import_rejects_invalid_bodies_and_every_truncation \
              entry_at_on_truncations_and_every_offset \
              fuzz_import_corpus_seeds_are_committed; do
            grep -Eq "^test $t \.\.\. ok$" vault.txt || { echo "missing: $t"; exit 1; }
          done
      - name: M6 gate by name (T-GEN-1 .. T-GEN-6; one line each in the log)
        # The steps above already run these in every configuration; this
        # step lists each gate test by name and fails if one did not run.
        # Release (built by the steps above), so the list costs seconds.
        run: |
          cargo test --locked --release --test gen 2>&1 | tee gen.txt
          for t in t_gen_1_byte_mapping_is_exact_for_every_n \
              t_gen_1_word_mapping_is_exact_over_24_bits \
              t_gen_2_exhaustive_uniformity t_gen_3_chi_square_default_policy \
              t_gen_4_valid_policies_produce_valid_output \
              t_gen_4_invalid_policies_return_err t_gen_4_each_constraint_at_its_limits \
              t_gen_5_inclusion_exclusion_matches_brute_force \
              t_gen_6_word_list_integrity; do
            grep -Eq "^test $t \.\.\. ok$" gen.txt || { echo "missing: $t"; exit 1; }
          done
      - name: T-STORE-1 on a real foreign filesystem (vfat loop mount)
        # Refused without --allow-foreign-fs; with it, the full save protocol
        # runs, including the copy fallback (vfat has no hard links). The
        # mount reports our UID and 0700/0600, as the override requires.
        run: |
          command -v mkfs.vfat || { sudo apt-get update && sudo apt-get install -y dosfstools; }
          truncate -s 64M "$RUNNER_TEMP/vfat.img"
          mkfs.vfat "$RUNNER_TEMP/vfat.img"
          sudo mkdir -p /mnt/pwv-vfat
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)",umask=077 "$RUNNER_TEMP/vfat.img" /mnt/pwv-vfat
          stat -f -c 'filesystem: %T (magic 0x%t)' /mnt/pwv-vfat
          PWV_FOREIGN_DIR=/mnt/pwv-vfat cargo test --locked --test store \
            -- --exact t_store_1_foreign_fs_real_mount 2>&1 | tee out.txt
          grep -q "test result: ok. 1 passed" out.txt
          for t in t_store_1_foreign_fs_real_mount; do
            grep -Eq "^test $t \.\.\. ok$" out.txt || { echo "missing: $t"; exit 1; }
          done
      - name: Keep the test logs (no secrets by design, rule 9)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs
          path: logs/
          retention-days: 30

  release-check:
    # M9, every push: T-REPRO-1 (two clean --locked release builds from
    # different paths, fixed SOURCE_DATE_EPOCH, --remap-path-prefix:
    # bit-identical), link hardening still applied (PIE, RELRO, BIND_NOW),
    # and T-ENG-7 (no PWV_MEMTEST / PWV_TESTKDF in the artefact; positive
    # control on a memtest,testkdf build). scripts/release_build.sh is the
    # same script the tag-triggered release workflow runs.
    # Measured 1m25 (M9 round 1); the 10 min floor applies.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: T-REPRO-1, T-ENG-7, hardening
        run: sh scripts/release_build.sh "$RUNNER_TEMP/dist"

  e2e:
    # M7 gate (spec 15.3): T-E2E-1 .. T-E2E-12 through a PTY (tests/e2e.rs),
    # T-CLIP-1 .. T-CLIP-4 and the clipboard half of T-E2E-6 on X11
    # (tests/clip.rs, under xvfb-run, with xclip and a mock clipboard
    # manager built on x11rb), and the pure cli/term tests (tests/cli.rs).
    # PWV_REQUIRE_X11 turns a missing display into a failure, so the
    # clipboard tests cannot pass vacuously. T-MEM-* stay in `test` and
    # `coredump`. Measured 6m02 (M7 round 1).
    # The test commands run under scripts/ci_guard.sh (see `test`).
    # Measured 6m19 (M7 round 2). With M8's T-MEM-4 and T-MIG: 6m41
    # (M8 round 2); 6m22 (M9 round 1). M9: the two logs are kept as the
    # artefact `e2e-logs` for the coverage report's test-ID table.
    runs-on: ubuntu-26.04
    timeout-minutes: 21
    env:
      PWV_REQUIRE_X11: "1"
      PWV_REQUIRE_GPG: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Xvfb, xclip, and GnuPG
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip gnupg
          gpg --version | sed -n 1p
      - name: Legacy program's Python imports (T-MIG-1 fixture)
        run: |
          python3 -m venv "$RUNNER_TEMP/legacy"
          "$RUNNER_TEMP/legacy/bin/pip" install "python-gnupg==$PY_GNUPG_VERSION" \
            "rich==$PY_RICH_VERSION" "pyperclip==$PY_PYPERCLIP_VERSION"
          echo "PWV_LEGACY_PYTHON=$RUNNER_TEMP/legacy/bin/python" >> "$GITHUB_ENV"
      - name: T-MEM-4 (memtest), T-MIG, T-E2E-10 with the real gpg
        run: sh scripts/ci_guard.sh xvfb-run -a cargo test --locked --no-fail-fast --features memtest --test mem --test mig 2>&1 | tee m8.txt
      - name: M8 gate by name (one line each in the log)
        run: |
          for t in scan::t_mem_4_canary_scan_mid_session_and_after_lock \
              scan::t_mem_4_signal_eof_and_idle_exits_are_wiped \
              scan::exit_pause_needs_the_environment_variable \
              scan::scan_skips_guard_pages_and_nothing_else \
              t_mig_1_legacy_fixture_imports_the_expected_model_with_its_warning \
              t_mig_1_key_case_collision_and_invalid_entries_are_refused \
              t_mig_1_wrong_legacy_passphrase_imports_nothing \
              t_mig_1_a_vault_larger_than_the_pipe_buffer_arrives_whole \
              t_mig_2_malicious_pickle_aborts_and_creates_no_marker \
              t_mig_2_script_has_no_code_executing_parser \
              t_mig_3_stdout_must_be_a_pipe \
              migrate_script_requires_the_vault_argument; do
            grep -Eq "^test $t \.\.\. ok$" m8.txt || { echo "missing: $t"; exit 1; }
          done
      - name: T-E2E, T-CLIP (default features)
        run: sh scripts/ci_guard.sh xvfb-run -a cargo test --locked --test cli --test e2e --test clip 2>&1 | tee e2e.txt
      - name: T-E2E without the clipboard feature (copy fails cleanly)
        run: sh scripts/ci_guard.sh cargo test --locked --no-default-features --test cli --test e2e --test clip
      - name: T-E2E, T-CLIP against the release binary
        run: sh scripts/ci_guard.sh xvfb-run -a cargo test --locked --release --test e2e --test clip
      - name: M7 gate by name (one line each in the log)
        run: |
          for t in t_e2e_1_init_weak_password_refused t_e2e_1_init_mismatch_refused \
              t_e2e_1_init_weak_password_needs_flag_and_sentence \
              t_e2e_1_init_generated_passphrase_accepted \
              t_e2e_1_init_refuses_existing_vault \
              t_e2e_2_missing_vault_names_init_and_creates_nothing \
              t_e2e_3_ls_names_only_and_show_masks \
              t_e2e_4_reveal_once_then_clears_screen_and_scrollback \
              t_e2e_5_add_and_set_errors_keep_the_session \
              t_e2e_5_set_replacing_a_sensitive_value_needs_confirmation \
              t_e2e_5_overlong_password_line_is_rejected_not_truncated \
              t_e2e_6_idle_timeout_locks_and_exits_0 \
              t_e2e_7_sigint_cancels_the_command \
              t_e2e_7_sigterm_sighup_sigquit_exit_cleanly_and_restore_termios \
              t_e2e_8_control_and_bidi_characters_are_shown_as_escapes \
              t_e2e_9_rm_needs_the_exact_name_and_there_is_no_export \
              t_e2e_10_import_valid_invalid_and_tty \
              t_e2e_10_import_reads_the_pipe_before_asking_for_the_master_password \
              t_e2e_11_passwd_then_only_the_new_password_opens \
              t_e2e_12_no_terminal_is_exit_4 \
              t_cry_2_wrong_password_and_damage_look_the_same \
              t_store_5_rollback_warning_no_exits_3_yes_continues \
              t_store_9_read_only_commands_never_write \
              x11::t_clip_1_copy_sets_the_history_exclusion_hint \
              x11::t_clip_2_clipboard_is_cleared_after_the_timeout \
              x11::t_clip_3_a_foreign_value_is_not_cleared \
              x11::t_clip_4_the_clipboard_manager_receives_nothing_sensitive_at_exit \
              x11::t_e2e_6_idle_exit_clears_the_clipboard \
              tokenizer_and_parser_on_every_truncation tokenizer_properties \
              sanitize_every_unsafe_character sanitize_properties_and_truncation \
              fuzz_corpus_seeds_are_committed; do
            grep -Eq "^test $t \.\.\. ok$" e2e.txt || { echo "missing: $t"; exit 1; }
          done
      - name: Keep the e2e logs (no secrets by design, rule 9)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-logs
          path: |
            m8.txt
            e2e.txt
          retention-days: 30

  compat:
    # T-COMPAT-1, independent half: the golden vaults decrypt to the manifest
    # models with argon2-cffi + PyNaCl (libsodium), sharing no code with pwv.
    # Measured 9 s (M6 round 1); the 10 min floor applies.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install reference implementations
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install \
            "argon2-cffi==$PY_ARGON2_CFFI_VERSION" "pynacl==$PY_PYNACL_VERSION"
      - name: Golden vaults decrypt independently
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/verify_golden.py tests/vectors'
      - name: Negative control (a flipped ciphertext byte must fail the check)
        run: |
          cp -r tests/vectors "$RUNNER_TEMP/bad"
          python3 -I -c 'import sys; p=sys.argv[1]; b=bytearray(open(p,"rb").read()); b[300]^=1; open(p,"wb").write(b)' \
            "$RUNNER_TEMP/bad/v1-small.pwv"
          if "$RUNNER_TEMP/venv/bin/python" -I scripts/verify_golden.py "$RUNNER_TEMP/bad" > out.txt; then
            echo "verifier accepted a tampered vault"; exit 1
          fi
          cat out.txt
          grep -q "FAIL: v1-small.pwv: authentication failed" out.txt

  fuzz-smoke:
    # T-FUZZ-1, T-FUZZ-2 (M2), T-FUZZ-3 (M3; with `testkdf`), T-FUZZ-6
    # (M5, import merge), T-FUZZ-4 (M7, tokenizer and command parser),
    # T-FUZZ-5 (M7, sanitize): 60 s per target, ASan, on every push.
    # Invariants (Section 14.10): no panic, no allocation above 64 MiB,
    # no input slower than 1 s, round-trip identity (asserted in-target).
    # Slowest target measured 2m37 (M6 round 1), 2m38 (M9 round 1); the
    # 10 min floor applies.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # ASan's quarantine keeps freed blocks resident (256 MiB by default on
      # x86_64), and libFuzzer's -rss_limit_mb counts them, so a target that
      # allocates per input (fuzz_body's output buffer) hits the 256 MiB limit
      # without any leak. Cap the quarantine; -malloc_limit_mb still enforces
      # "no allocation above 64 MiB". DESIGN_NOTES.md, 2026-11-11.
      ASAN_OPTIONS: quarantine_size_mb=32:detect_leaks=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: fuzz_header, features: "" }
          - { target: fuzz_body, features: "" }
          - { target: fuzz_open, features: "--features testkdf" }
          - { target: fuzz_import, features: "" }
          # M7; measured 2m13 and 1m57 (M7 round 1).
          - { target: fuzz_tokenizer, features: "" }
          - { target: fuzz_sanitize, features: "" }
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"
      - name: Fuzz ${{ matrix.target }} for 60 s
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          cargo +nightly fuzz run ${{ matrix.features }} ${{ matrix.target }} "$RUNNER_TEMP/corpus" \
            fuzz/corpus/${{ matrix.target }} -- \
            -max_total_time=60 -rss_limit_mb=256 -malloc_limit_mb=64 \
            -timeout=1 -max_len=24576
      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  sanitizers:
    # T-SAN-2: Miri on `format` (M2) and on the M3 code (`crypto`, the
    # `vault` lifecycle, the `KdfRegion` cast in `secmem`). Every push and
    # nightly until M9; since M9 nightly and on "run now" only (owner,
    # 2026-11-16; spec 15.3). One job per suite, in parallel, each with its own cap (3x its
    # slowest measured time); --report-time names any slow test. T-SAN-1 (ASan)
    # is the separate job `sanitizers-asan` (M9).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format # measured 15m45 (M9 nightly 1; 9m34 in M6 round 1)
            timeout: 48
            args: "--no-default-features --test format -- --skip t_fmt_2_entry_count"
          - name: format-10000-entries # measured 11m58 (M6 round 3)
            timeout: 36
            args: "--no-default-features --test format -- --exact t_fmt_2_entry_count_0_max_max_plus_1"
          - name: format-testkdf # measured 26m13 (M8 round 2; 20m16 in M7 round 1)
            timeout: 79
            args: "--no-default-features --features testkdf --test format --"
          # Native runs cover the heavy sweeps (T-CRY-1, -3, -5), the 6 MiB
          # capacity case, file I/O, and child processes (Miri isolation).
          - name: crypto-vault # measured 10m02 (M7 round 1)
            timeout: 31
            args: >-
              --no-default-features --features testkdf --test crypto --
              t_kat_ normalize_ kdf_write_policy ct_eq_and_wrap lifecycle_
              t_cry_2_ t_cry_4_ t_cry_6_ unlock_rejects_
          # M5 model, in four jobs. T-VAULT-1 runs 2 cases, without the
          # ~120 KiB prefill and without file I/O (save and reopen go through
          # the sealed file in memory). The 10,000-entry, capacity, and
          # every-offset truncation sweeps run natively only.
          # Round 1 ran all of the model tests in one job (115 min cap, hit).
          # Round 2 ran them in three; `vault-model-t-vault-1` (both cases
          # in one job) hit its 180 min cap. Since then: wipes and the
          # allocator's zero check go a u64 at a time (an eighth of the
          # interpreted stores), and T-VAULT-1's two cases run in two jobs,
          # one case each (PROPTEST_CASES=1, fixed PROPTEST_RNG_SEED 1 and
          # 2; seed 1 is 153 operations, seed 2 is 25), so --report-time
          # gives a time per case (DESIGN_NOTES, M5 CI round 2).
          - name: vault-model # measured 11m42 (M9 nightly 1; 11m35 in M8 round 2)
            timeout: 36
            args: >-
              --no-default-features --features testkdf --test vault --
              new_ set_replaces renames_to_self mv_reorders
              input_validation missing_entries import_merges import_suffix
              import_one_save seal_ error_messages
          # Seed 1 (153 operations, 16 segments of 10) ran 5h09m44 to
          # 5h32m29 in one job, against GitHub's 360 min limit. M8 ran it in
          # four parts (46m30, 1h28m23, 3h03m16, 1h46m54 in M8 round 2).
          # Since M9 the parts are explicit segment ranges chosen from those
          # times (PWV_T_VAULT_1_PART=a..b; the last is open-ended): each
          # part replays the earlier operations on the reference only and
          # starts from the file the full run would reopen there. Every
          # operation is checked in exactly one part, and all five are
          # needed: t_vault_1_ci_ranges_cover_every_segment_once reads the
          # `part:` values below (DESIGN_NOTES, M8 CI round 1 and M9).
          # Measured in M9 nightly 1: 1h55m40, 2h10m07, 1h13m16, 47m36,
          # 1h20m44. Caps 3x (part 2: 350, the ceiling under GitHub's 360).
          - name: vault-model-t-vault-1-case-1-part-1
            timeout: 347
            seed: "1"
            part: "0..10"
            args: >-
              --no-default-features --features testkdf --test vault --
              --exact t_vault_1_model_matches_reference
          - name: vault-model-t-vault-1-case-1-part-2
            timeout: 350
            seed: "1"
            part: "10..12"
            args: >-
              --no-default-features --features testkdf --test vault --
              --exact t_vault_1_model_matches_reference
          - name: vault-model-t-vault-1-case-1-part-3
            timeout: 220
            seed: "1"
            part: "12..13"
            args: >-
              --no-default-features --features testkdf --test vault --
              --exact t_vault_1_model_matches_reference
          - name: vault-model-t-vault-1-case-1-part-4
            timeout: 143
            seed: "1"
            part: "13..14"
            args: >-
              --no-default-features --features testkdf --test vault --
              --exact t_vault_1_model_matches_reference
          - name: vault-model-t-vault-1-case-1-part-5
            timeout: 243
            seed: "1"
            part: "14.."
            args: >-
              --no-default-features --features testkdf --test vault --
              --exact t_vault_1_model_matches_reference
          - name: vault-model-t-vault-1-case-2 # measured 8m47 (M6 round 3)
            timeout: 27
            seed: "2"
            args: >-
              --no-default-features --features testkdf --test vault --
              --exact t_vault_1_model_matches_reference
          - name: vault-model-t-vault-2 # measured 1h45m42 (M6 round 3)
            timeout: 318
            args: >-
              --no-default-features --features testkdf --test vault --
              t_vault_2_
          # M6 generator (tests/gen.rs). Miri runs the subset selected by
          # cfg!(miri) inside the tests (T-GEN-1 over 8 values of n and a
          # sample of 24-bit values, T-GEN-2 with 2 byte values per residue,
          # T-GEN-4 with 8 + 16 cases, T-GEN-5 for n, L <= 4). T-GEN-3 (10^6
          # characters) and T-GEN-6 (SHA-256 of the 2.2 MB list) run
          # natively only.
          - name: gen # measured 3m24 (M6 round 1)
            timeout: 11
            args: >-
              --no-default-features --test gen --
              --skip t_gen_3_ --skip t_gen_6_ --skip t_gen_4_valid
              --skip word_draw --skip os_bytes --skip entropy_known
              --skip rng_failure --skip passphrase_too_long
          # The tests that draw passphrases (each word is found by a scan of
          # the embedded list), one job per test. Round 1 ran them in one
          # job, which hit its provisional 180 min cap (DESIGN_NOTES, M6 CI
          # round 1). Round 2: all passed except `word_draw`, which hit its
          # provisional 350 cap. Cause, measured with Miri locally (M6 CI
          # round 3): the test found the longest word with `max_by_key`,
          # which is quadratic under Stacked Borrows (about 14 h for the
          # 205,690 words). It now uses a linear loop, is split in two,
          # and prints phase markers (--nocapture). Both passed in M6 CI
          # round 3 (41m43 and 13m26) and in M7 CI round 1.
          # Measured 2h01m10 (M7 round 1; 1h18m57 in M6 round 3). 3x does
          # not fit under the 360 min job limit: capped at 350.
          - name: gen-words-t-gen-4-valid
            timeout: 350
            args: >-
              --no-default-features --test gen --
              --exact t_gen_4_valid_policies_produce_valid_output
          - name: gen-words-word-draw # measured 1h17m43 (M7 round 2)
            timeout: 234
            args: >-
              --no-default-features --test gen --
              --exact word_draw_maps_three_bytes_to_the_listed_word --nocapture
          - name: gen-words-word-draw-ends # measured 20m06 (M7 round 1)
            timeout: 61
            args: >-
              --no-default-features --test gen --
              --exact word_draw_first_middle_and_last_index --nocapture
          - name: gen-words-os-bytes # measured 16m13 (M9 nightly 1; 15m59 in M6 round 3)
            timeout: 49
            args: >-
              --no-default-features --test gen --
              --exact os_bytes_generates_both_modes
          - name: gen-words-entropy-known # measured 12m07 (M6 round 3)
            timeout: 37
            args: >-
              --no-default-features --test gen --
              --exact entropy_known_values_and_both_paths
          - name: gen-words-rng-failure # measured 15m47 (M7 round 1)
            timeout: 48
            args: >-
              --no-default-features --test gen --
              --exact rng_failure_at_every_point_clears_the_slot
          - name: gen-words-passphrase-too-long # measured 13m42 (M7 round 2)
            timeout: 42
            args: >-
              --no-default-features --test gen --
              --exact passphrase_too_long_for_slot_is_capacity
    name: sanitizers (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          cargo +nightly miri setup
      - name: T-SAN-2 Miri (${{ matrix.name }})
        # Entries with a `seed` run one proptest case with that fixed seed,
        # and a `part` runs one part of it: Miri isolation hides the host
        # environment, so these variables are forwarded explicitly
        # (tests/vault.rs, `cases`, `t_vault_1_part_env`).
        env:
          PROPTEST_CASES: ${{ matrix.seed && '1' || '' }}
          PROPTEST_RNG_SEED: ${{ matrix.seed }}
          PWV_T_VAULT_1_PART: ${{ matrix.part }}
          MIRIFLAGS: >-
            ${{ matrix.seed && '-Zmiri-env-forward=PROPTEST_CASES -Zmiri-env-forward=PROPTEST_RNG_SEED' || '' }}
            ${{ matrix.part && '-Zmiri-env-forward=PWV_T_VAULT_1_PART' || '' }}
        run: >-
          cargo +nightly miri test --locked ${{ matrix.args }}
          -Zunstable-options --report-time

  sanitizers-asan:
    # T-SAN-1 (spec 14.11; spec 15.3 lists it under `sanitizers`): the full
    # test suite under AddressSanitizer, nightly, in the four debug
    # configurations of `test`, under xvfb-run so the clipboard tests run
    # too. The PTY tests' `pwv` children are the same ASan build.
    # Owner decisions (2026-11-16; DESIGN_NOTES, M9):
    # - tests/mem.rs (T-MEM-4's canary scan) is left out: its scanner reads
    #   every readable mapping, and ASan's shadow memory is a reserved
    #   mapping of terabytes. T-MEM-4 itself runs in `e2e`.
    # - LeakSanitizer is on. A harmless report would get a named, dated
    #   suppression, never detect_leaks=0.
    # handle_segv=0: T-MEM-2 and T-MEM-5 need a SIGSEGV to kill the child
    # (ASan would catch it and exit 1 instead). log_path: a child's report
    # would otherwise go to its PTY, which tests never print, so reports go
    # to files and the last step fails if there is any.
    # RUSTFLAGS replaces .cargo/config.toml's link hardening: acceptable for
    # a test build (T-REPRO-1's script checks the release artefact).
    # Measured 13m00 to 17m49 (M9 nightly 1); cap 54 (3x).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 54
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--features memtest", "--features testkdf", "--features memtest,testkdf"]
    name: sanitizers-asan (${{ matrix.features || 'default' }})
    env:
      PWV_REQUIRE_X11: "1"
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly, Xvfb, xclip, llvm-symbolizer
        run: |
          rustup toolchain install nightly --profile minimal
          sudo apt-get update
          sudo apt-get install -y xvfb xclip llvm
          command -v llvm-symbolizer  # readable stack traces in reports
      - name: T-SAN-1 (every test target except tests/mem.rs)
        run: |
          mkdir -p "$RUNNER_TEMP/asan"
          export ASAN_OPTIONS="detect_leaks=1:handle_segv=0:log_path=$RUNNER_TEMP/asan/report"
          targets=""
          for f in tests/*.rs; do
            n=$(basename "$f" .rs)
            [ "$n" = mem ] || targets="$targets --test $n"
          done
          sh scripts/ci_guard.sh xvfb-run -a cargo +nightly test --locked --no-fail-fast \
            --target x86_64-unknown-linux-gnu --lib --bins $targets ${{ matrix.features }}
      - name: No AddressSanitizer report from any process
        if: always()
        # Reports hold stack traces, addresses, and shadow bytes, never
        # memory contents. Every report fails the step except one named
        # false report, accepted only when the file holds exactly these
        # two lines (DESIGN_NOTES, "M9 first full run on main", 2026-11-17):
        #   WARNING: ptrace appears to be blocked (is seccomp enabled?). ...
        #   Child exited with signal 42.
        # LSan's ptrace self-test (TestPTrace, at a process's first leak
        # check) ignores waitpid's result. When a signal interrupts that
        # waitpid (pwv's handlers have no SA_RESTART, and the PTY harness
        # sends SIGHUP to a child still exiting), it reads its unwritten
        # status, filled with 0xaaaaaaaa: 0xaa & 0x7f = 42. Nothing was
        # killed and the leak check still runs; a leak would add lines,
        # and a real seccomp kill reports a different signal, so both fail.
        run: |
          benign='WARNING: ptrace appears to be blocked (is seccomp enabled?). LeakSanitizer may hang.
          Child exited with signal 42.'
          benign=$(printf '%s\n' "$benign" | sed 's/^ *//')
          fail=0
          accepted=0
          for f in "$RUNNER_TEMP"/asan/report*; do
            [ -e "$f" ] || continue
            if [ "$(sed 's/^==[0-9]*==//' "$f")" = "$benign" ]; then
              accepted=$((accepted + 1))
              echo "accepted (named false report, LSan TestPTrace EINTR): $(basename "$f")"
            else
              cat "$f"
              fail=1
            fi
          done
          echo "reports failing: $fail (0/1); named false reports accepted: $accepted"
          exit "$fail"

  test-arm64:
    # Spec 15.3: "an aarch64 runner nightly" (owner, 2026-11-16: the
    # repository is public, so GitHub's Arm runners are available). The five
    # configurations of `test`, nightly and on "Run workflow". The arena
    # and the T-MEM-4 scanner use the kernel's page size (an arm64 kernel
    # may use 16 or 64 KiB pages; DESIGN_NOTES, M9).
    # If the runner label does not exist, the job waits for a runner and
    # never starts: check the label against GitHub's runner list.
    # Measured 57m17 (M9 nightly 1); cap 172 (3x).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 172
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          uname -m
          getconf PAGESIZE
          rustup show active-toolchain || rustup toolchain install
      - run: mkdir -p logs
      - name: Debug, default features
        run: sh scripts/ci_guard.sh cargo test --locked 2>&1 | tee logs/default.txt
      - name: Debug, memtest
        run: sh scripts/ci_guard.sh cargo test --locked --features memtest 2>&1 | tee logs/memtest.txt
      - name: Release
        run: sh scripts/ci_guard.sh cargo test --locked --release 2>&1 | tee logs/release.txt
      - name: Debug, testkdf
        run: sh scripts/ci_guard.sh cargo test --locked --features testkdf 2>&1 | tee logs/testkdf.txt
      - name: Debug, memtest + testkdf
        run: sh scripts/ci_guard.sh cargo test --locked --features memtest,testkdf 2>&1 | tee logs/memtest-testkdf.txt
      - name: Gate by name on arm64 (every ID whose tests run in `test`)
        run: >-
          python3 -I scripts/test_ids.py --require
          T-KAT-1,T-KAT-2,T-COMPAT-1,T-FMT-1,T-FMT-2,T-FMT-3,T-FMT-4,T-CRY-1,T-CRY-2,T-CRY-3,T-CRY-4,T-CRY-5,T-CRY-6,T-GEN-1,T-GEN-2,T-GEN-3,T-GEN-4,T-GEN-5,T-GEN-6,T-STORE-2,T-STORE-3,T-STORE-4,T-STORE-5,T-STORE-6,T-STORE-7,T-STORE-9,T-VAULT-1,T-VAULT-2,T-MEM-1,T-MEM-2,T-MEM-3,T-MEM-4,T-MEM-5,T-MEM-6,T-MEM-7,T-ENG-2,T-ENG-3,T-ENG-4
          --logs logs/*.txt
      - name: Keep the arm64 test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs-arm64
          path: logs/
          retention-days: 30

  durability:
    # T-STORE-3 at the nightly size of Section 15.3 (5,000 SIGKILLs at a
    # uniform 0-50 ms into the save loop), nightly and on "run now" (every
    # push until M9), against the runner's ext4 disk.
    # Measured 3m24 (M6 round 1), 4m07 (M8 round 2), 3m33 (M9 nightly 1).
    # M9: T-STORE-8, the same kill loop on a LazyFS mount with a simulated
    # power loss (`lazyfs::clear-cache`: unsynced data dropped) after every
    # kill, 5,000 iterations; built from source (scripts/lazyfs.sh).
    # Provisional cap 60 until measured.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: T-STORE-3 kill loop, 5,000 iterations (release)
        env:
          PWV_T_STORE_3_ITERATIONS: "5000"
        run: cargo test --locked --release --test store -- --exact t_store_3_kill_loop --nocapture
      - name: Install FUSE 3 and LazyFS's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev cmake g++
          # LazyFS's mount script passes -o allow_other.
          grep -q '^user_allow_other' /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: Build and mount LazyFS
        run: sh scripts/lazyfs.sh "$RUNNER_TEMP/lazyfs"
      - name: T-STORE-8 kill loop with power loss, 5,000 iterations (release)
        env:
          PWV_REQUIRE_LAZYFS: "1"
          PWV_T_STORE_8_ITERATIONS: "5000"
        run: >-
          cargo test --locked --release --test store --
          --exact t_store_8_kill_loop_with_power_loss --nocapture 2>&1 | tee store8.txt
      - name: T-STORE-8 gate by name
        # A single test run with --nocapture prints its name, then its
        # summary line, then `ok`: check each part.
        run: |
          for t in t_store_8_kill_loop_with_power_loss; do
            grep -Eq "^test $t \.\.\. " store8.txt || { echo "missing: $t"; exit 1; }
          done
          grep -q "T-STORE-8: seed .*, 5000 kills" store8.txt
          grep -q "test result: ok. 1 passed" store8.txt
      - name: LazyFS log (on failure)
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/lazyfs/lazyfs.log" || true

  perf:
    # T-PERF-1 (spec 14.12; owner decision 4, M9): unlock at the default
    # parameters <= 3 s, a save of 1,000 entries on tmpfs (/dev/shm, so
    # "excluding fsync") <= 50 ms, allocator overhead <= 5 % (in-process
    # benchmark, System vs ZeroizingAlloc::new(false)); medians, release
    # build, one test thread, nightly. The runner is recorded in the log.
    # Locally (2026-11-17): 0.285 s, 0.39 ms, about +-0.2 %.
    # Provisional cap 20 until measured.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Reference runner
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo
          free -m
          stat -f -c '/dev/shm: %T' /dev/shm
      - name: T-PERF-1 (release)
        env:
          PWV_PERF: "1"
          PWV_PERF_TMPFS: /dev/shm
        run: cargo test --locked --release --test perf -- --test-threads=1 2>&1 | tee perf.txt
      - name: T-PERF-1 gate by name
        run: |
          for t in t_perf_1_unlock_at_default_parameters \
              t_perf_1_save_1000_entries_on_tmpfs t_perf_1_allocator_overhead; do
            grep -Eq "^test $t \.\.\. " perf.txt || { echo "missing: $t"; exit 1; }
          done
          for m in "T-PERF-1 unlock" "T-PERF-1 save" "T-PERF-1 allocator"; do
            grep -q "$m" perf.txt || { echo "no measurement: $m"; exit 1; }
          done
          grep -q "test result: ok. 3 passed" perf.txt

  coredump:
    # T-MEM-5, "no core file and no coredumpctl entry", on the host the owner
    # decision assumes (DESIGN_NOTES.md: suid_dumpable = 0) with
    # systemd-coredump as the piped core_pattern. A positive control first
    # proves that a crash of a dumpable process does produce an entry here,
    # so the negative check is not vacuous.
    # Measured 1m19 (M6 round 1); the 10 min floor applies.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install systemd-coredump; set suid_dumpable = 0
        run: |
          sudo systemctl disable --now apport.service 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y systemd-coredump
          sudo sysctl -p /usr/lib/sysctl.d/50-coredump.conf
          sudo sysctl -w fs.suid_dumpable=0
          sudo systemctl start systemd-coredump.socket
          sysctl kernel.core_pattern fs.suid_dumpable
          case "$(sysctl -n kernel.core_pattern)" in
            *systemd-coredump*) ;;
            *) echo "core_pattern is not systemd-coredump"; exit 1 ;;
          esac
      - name: Positive control (a dumpable crash is recorded)
        run: |
          # Our own binary, not a renamed system tool: on 26.04 coreutils is
          # one multicall binary that refuses unknown names. It aborts
          # itself (SIGABRT, a core-dumping signal), so there is no race.
          printf 'fn main() { std::process::abort() }\n' > "$RUNNER_TEMP/pwvctl.rs"
          rustc -o "$RUNNER_TEMP/pwvctl" "$RUNNER_TEMP/pwvctl.rs"
          ulimit -c unlimited
          if "$RUNNER_TEMP/pwvctl"; then echo "control did not crash"; exit 1; fi
          for _ in $(seq 30); do
            coredumpctl --no-pager list pwvctl && exit 0
            sleep 1
          done
          echo "systemd-coredump recorded nothing; the check below would be vacuous"
          exit 1
      - name: Build release tests
        run: cargo test --locked --release --test harden --no-run
      - name: T-MEM-5 (release)
        run: cargo test --locked --release --test harden t_mem_5
      - name: No coredumpctl entry for pwv
        run: |
          sleep 10 # systemd-coredump processes crashes asynchronously
          if coredumpctl --no-pager list pwv; then
            echo "T-MEM-5: coredumpctl has an entry for pwv"
            exit 1
          fi
          coredumpctl --no-pager list || true

  supply:
    # T-SUPPLY-1. Measured 5m31 (M6 round 1; it builds both tools).
    runs-on: ubuntu-26.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
      - name: cargo deny (advisories, bans, licenses, sources)
        run: cargo deny --locked check
      - name: cargo audit
        run: cargo audit --deny warnings

  coverage:
    # Spec 14.13 (M9): line, region and function coverage of the whole test
    # suite on the pinned stable toolchain (llvm-tools from
    # rust-toolchain.toml), one job per configuration of `test`, merged by
    # `coverage-report`. The PTY tests' `pwv` children are instrumented and
    # write their own profiles. The two display runs execute T-E2E, T-CLIP
    # and T-MEM-4's clipboard branch under xvfb-run, and T-MIG with the real
    # gpg (as `e2e` does); the others run without a display, so the "no
    # clipboard" paths are measured too. Fixed seeds (determinism). Release
    # builds, Miri, sanitizers, fuzzing, mutants and `durability` are not
    # included (spec). Measured 11m42 to 24m27 (M9 round 4, first full
    # merge; slowest `memtest`); cap 74 (3x the slowest).
    runs-on: ubuntu-26.04
    timeout-minutes: 74
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, args: "", display: true }
          - { name: memtest, args: "--features memtest", display: true }
          - { name: no-default-features, args: "--no-default-features", display: false }
          - { name: testkdf, args: "--features testkdf", display: false }
          - { name: memtest-testkdf, args: "--features memtest,testkdf", display: false }
    name: coverage (${{ matrix.name }})
    env:
      PROPTEST_RNG_SEED: "20261117"
      PWV_T_STORE_3_SEED: "0x5eed5eed5eed5eed"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (with llvm-tools) and cargo-llvm-cov
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
      - name: Install Xvfb, xclip, GnuPG and the legacy program's imports
        if: ${{ matrix.display }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip gnupg
          python3 -m venv "$RUNNER_TEMP/legacy"
          "$RUNNER_TEMP/legacy/bin/pip" install "python-gnupg==$PY_GNUPG_VERSION" \
            "rich==$PY_RICH_VERSION" "pyperclip==$PY_PYPERCLIP_VERSION"
          {
            echo "PWV_LEGACY_PYTHON=$RUNNER_TEMP/legacy/bin/python"
            echo "PWV_REQUIRE_X11=1"
            echo "PWV_REQUIRE_GPG=1"
          } >> "$GITHUB_ENV"
      - name: vfat loop mount (T-STORE-1's real foreign filesystem)
        # As in `test`: with PWV_FOREIGN_DIR set, the instrumented suite runs
        # t_store_1_foreign_fs_real_mount too, so the ForeignFs refusal and
        # the save protocol's copy fallback on a real mount are measured.
        run: |
          command -v mkfs.vfat || { sudo apt-get update && sudo apt-get install -y dosfstools; }
          truncate -s 64M "$RUNNER_TEMP/vfat.img"
          mkfs.vfat "$RUNNER_TEMP/vfat.img"
          sudo mkdir -p /mnt/pwv-vfat
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)",umask=077 "$RUNNER_TEMP/vfat.img" /mnt/pwv-vfat
          stat -f -c 'filesystem: %T (magic 0x%t)' /mnt/pwv-vfat
          echo "PWV_FOREIGN_DIR=/mnt/pwv-vfat" >> "$GITHUB_ENV"
      - name: Instrumented test suite (${{ matrix.name }})
        run: |
          xvfb=""
          if [ "${{ matrix.display }}" = true ]; then xvfb="xvfb-run -a"; fi
          sh scripts/ci_guard.sh $xvfb sh scripts/coverage_run.sh \
            "cov/coverage-${{ matrix.name }}" "${{ matrix.name }}" ${{ matrix.args }}
      - name: Keep the coverage data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.name }}
          path: cov/coverage-${{ matrix.name }}/
          retention-days: 30

  coverage-branch:
    # T-COV-5 (spec 14.13): branch coverage needs nightly (`--branch`); the
    # same five configurations as `coverage`, nightly and on "Run
    # workflow". The report records the exact nightly version. Provisional
    # cap 90 until measured.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, args: "", display: true }
          - { name: memtest, args: "--features memtest", display: true }
          - { name: no-default-features, args: "--no-default-features", display: false }
          - { name: testkdf, args: "--features testkdf", display: false }
          - { name: memtest-testkdf, args: "--features memtest,testkdf", display: false }
    name: coverage-branch (${{ matrix.name }})
    env:
      PROPTEST_RNG_SEED: "20261117"
      PWV_T_STORE_3_SEED: "0x5eed5eed5eed5eed"
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly (with llvm-tools) and cargo-llvm-cov
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools
          rustup show active-toolchain || rustup toolchain install
          cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
      - name: Install Xvfb, xclip, GnuPG and the legacy program's imports
        if: ${{ matrix.display }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip gnupg
          python3 -m venv "$RUNNER_TEMP/legacy"
          "$RUNNER_TEMP/legacy/bin/pip" install "python-gnupg==$PY_GNUPG_VERSION" \
            "rich==$PY_RICH_VERSION" "pyperclip==$PY_PYPERCLIP_VERSION"
          {
            echo "PWV_LEGACY_PYTHON=$RUNNER_TEMP/legacy/bin/python"
            echo "PWV_REQUIRE_X11=1"
            echo "PWV_REQUIRE_GPG=1"
          } >> "$GITHUB_ENV"
      - name: vfat loop mount (T-STORE-1's real foreign filesystem)
        # As in `coverage`.
        run: |
          command -v mkfs.vfat || { sudo apt-get update && sudo apt-get install -y dosfstools; }
          truncate -s 64M "$RUNNER_TEMP/vfat.img"
          mkfs.vfat "$RUNNER_TEMP/vfat.img"
          sudo mkdir -p /mnt/pwv-vfat
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)",umask=077 "$RUNNER_TEMP/vfat.img" /mnt/pwv-vfat
          echo "PWV_FOREIGN_DIR=/mnt/pwv-vfat" >> "$GITHUB_ENV"
      - name: Instrumented test suite with branches (${{ matrix.name }})
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          rustc -V
          xvfb=""
          if [ "${{ matrix.display }}" = true ]; then xvfb="xvfb-run -a"; fi
          sh scripts/ci_guard.sh $xvfb sh scripts/coverage_run.sh --branch \
            "cov/branchcov-${{ matrix.name }}" "${{ matrix.name }}" ${{ matrix.args }}
      - name: Keep the branch coverage data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: branchcov-${{ matrix.name }}
          path: cov/branchcov-${{ matrix.name }}/
          retention-days: 30

  fuzz-long:
    # Spec 14.10 / 15.3: 30 min per target, nightly, seeded by the committed
    # corpus and by the previous night's corpus (actions/cache, restored by
    # prefix; the newest wins), which is saved again and kept as an artefact.
    # Same invariants and limits as `fuzz-smoke`. Every crash becomes a
    # regression unit test before it is fixed. Then T-COV-6 (report-only):
    # region coverage of `format` and `vault` replaying the corpus (`cargo
    # fuzz coverage`), compared with the previous night's figure.
    # Provisional cap 60 until measured.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: quarantine_size_mb=32:detect_leaks=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: fuzz_header, features: "" }
          - { target: fuzz_body, features: "" }
          - { target: fuzz_open, features: "--features testkdf" }
          - { target: fuzz_import, features: "" }
          - { target: fuzz_tokenizer, features: "" }
          - { target: fuzz_sanitize, features: "" }
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly (with llvm-tools) and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools
          cargo +nightly install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"
      - name: Restore the previous night's corpus and T-COV-6 figures
        uses: actions/cache/restore@v5
        with:
          path: long
          key: fuzz-long-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-long-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }} for 30 min
        run: |
          mkdir -p long/corpus
          ls long/corpus | wc -l
          cargo +nightly fuzz run ${{ matrix.features }} ${{ matrix.target }} long/corpus \
            fuzz/corpus/${{ matrix.target }} -- \
            -max_total_time=1800 -rss_limit_mb=256 -malloc_limit_mb=64 \
            -timeout=1 -max_len=24576
          ls long/corpus | wc -l
      - name: T-COV-6 corpus coverage (report-only)
        run: |
          cargo +nightly fuzz coverage ${{ matrix.features }} ${{ matrix.target }} long/corpus \
            fuzz/corpus/${{ matrix.target }}
          bin=$(find target -path '*coverage*' -type f -name '${{ matrix.target }}' -perm -u+x | head -n 1)
          llvm_cov="$(rustc +nightly --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-cov"
          "$llvm_cov" export -format=text \
            -instr-profile="fuzz/coverage/${{ matrix.target }}/coverage.profdata" "$bin" > export.json
          python3 -I scripts/fuzz_cov.py ${{ matrix.target }} export.json tcov6.json \
            long/tcov6.json >> "$GITHUB_STEP_SUMMARY"
          cp tcov6.json long/tcov6.json
      - name: Save the corpus and figures for the next night
        if: always()
        uses: actions/cache/save@v5
        with:
          path: long
          key: fuzz-long-${{ matrix.target }}-${{ github.run_id }}
      - name: Keep the corpus
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-long-corpus-${{ matrix.target }}
          path: long/
          retention-days: 30
      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-long-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  coverage-report:
    # Spec 14.13 (M9): after every coverage run, merges them (by line, and
    # regions, functions and branches by source span; scripts/
    # coverage_report.py), checks T-COV-1 .. T-COV-5 against
    # coverage/baseline.json and DESIGN_NOTES' "Coverage exceptions", and
    # writes the job summary: tables per Section 3 group and file, the
    # T-COV-3 list of `unsafe` blocks, the uncovered lines of the gated
    # modules, toolchains and seeds, and every Section 14 test ID with its
    # status (test logs of `test`, `e2e` and the coverage runs, plus the
    # result of each job named as evidence). Artefacts kept 30 days.
    # Waits for every job of the run (nightly ones are skipped on pushes).
    # The only job with `contents: write` (spec 14.13; owner decision 3):
    # it pushes two SVG badges to the orphan `badges` branch, only from runs
    # on `main` that no fork can start: pushes, the nightly schedule, and
    # "Run workflow" (owner, 2026-11-18; never on pull_request). The
    # coverage badge comes from every such run; the test-ID badge only from
    # full runs (nightly, "Run workflow"), since a push run skips the
    # nightly gates: a push run keeps the branch's previous test-ID badge.
    # T-MUT-1 is the latest completed mutants.yml run on `main` (GitHub
    # API, `actions: read`), counted if it finished within 8 days.
    # Provisional cap 15 until measured.
    needs:
      - lint
      - test
      - release-check
      - e2e
      - compat
      - fuzz-smoke
      - sanitizers
      - sanitizers-asan
      - test-arm64
      - durability
      - perf
      - coredump
      - supply
      - coverage
      - coverage-branch
      - fuzz-long
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read # the latest mutants.yml run (T-MUT-1)
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # T-MUT-1 lives in mutants.yml. A failed lookup leaves mutants.json
      # missing, and the report then counts T-MUT-1 as not run.
      - name: Latest completed mutants.yml run on main (T-MUT-1)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/mutants.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0] // {} | {conclusion, head_sha, updated_at, html_url}' > mutants.json
          cat mutants.json
      - name: Download the coverage runs
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: runs/coverage
      - name: Download the branch coverage runs (nightly only)
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: branchcov-*
          path: runs/branch
      - name: Download the test logs
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: "*-logs"
          path: logs
      - name: Coverage report (T-COV-1 .. T-COV-5) and test-ID table
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          mkdir -p out
          status=0
          python3 -I scripts/coverage_report.py --runs runs/coverage --branch-runs runs/branch \
            --baseline coverage/baseline.json --notes DESIGN_NOTES.md --jobs needs.json \
            --summary "$GITHUB_STEP_SUMMARY" --merged-lcov out/merged.lcov \
            --new-baseline out/baseline-candidate.json --badges out/badges \
            --mutants mutants.json --logs $(find logs -name '*.txt') || status=$?
          echo "COVERAGE_STATUS=$status" >> "$GITHUB_ENV"
      - name: Keep the report (merged LCOV, baseline candidate, badges)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: out/
          retention-days: 30
      - name: Push the badges to the orphan `badges` branch (runs on main, never pull requests)
        if: ${{ always() && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out/badges
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # A push run skips the nightly gates: keep the test-ID badge of
            # the last full run, if there is one.
            if git fetch -q --depth 1 "$repo" badges 2>/dev/null \
              && git show FETCH_HEAD:test-ids.svg > test-ids.prev 2>/dev/null; then
              mv test-ids.prev test-ids.svg
              echo "test-ids.svg kept from the last full run"
            fi
            rm -f test-ids.prev
          fi
          git add coverage.svg test-ids.svg
          git commit -q -m "Badges for $GITHUB_SHA ($GITHUB_EVENT_NAME run $GITHUB_RUN_ID)"
          git push -q --force "$repo" badges
      - name: Gates
        run: exit "${COVERAGE_STATUS:-1}"
