# CI for pwv (spec Section 15.3). M0: `lint`, `supply`. M1: `test`,
# `coredump` (T-MEM-5's coredumpctl clause). M2: `fuzz-smoke`, `sanitizers`
# (Miri on format), testkdf test build. M3: crypto and lifecycle tests in
# `test`, `compat` (golden vaults checked by an independent implementation),
# T-FUZZ-3 in `fuzz-smoke`, Miri on crypto and vault in `sanitizers`.
# M4: storage tests in `test` (T-STORE-1 .. T-STORE-7, T-STORE-9; T-STORE-2
# is a lib unit test), a vfat loop mount for T-STORE-1's foreign-filesystem
# refusal, and `durability` (T-STORE-3 at 5,000 iterations; LazyFS for
# T-STORE-8 joins it in M9).
# Every gate of the milestones done so far runs on every push, so no local
# nightly toolchain is needed. `sanitizers` (spec: nightly) runs on every push
# as well as nightly. Later milestones add e2e, fuzz-long, ASan, coverage,
# mutants, durability, and release jobs.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *" # daily, for `supply` (new advisories)

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.23.0"
  TOKEI_VERSION: "15.0.0"
  CARGO_FUZZ_VERSION: "0.13.2"
  # `compat`: reference implementations for the independent golden check.
  PY_ARGON2_CFFI_VERSION: "23.1.0"
  PY_PYNACL_VERSION: "1.5.0"

jobs:
  lint:
    # T-ENG-1 .. T-ENG-6 (T-ENG-5 compiles with the test suite from M1 on).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: T-ENG-1 rustfmt
        run: |
          cargo fmt --all --check
          (cd fuzz && cargo fmt --all --check)
      - name: T-ENG-1/T-ENG-4 clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: T-ENG-1/T-ENG-4 clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: T-ENG-1/T-ENG-4 clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: T-ENG-1/T-ENG-4 clippy (memtest)
        run: cargo clippy --locked --all-targets --features memtest -- -D warnings
      - name: T-ENG-1/T-ENG-4 clippy (testkdf)
        run: cargo clippy --locked --all-targets --features testkdf -- -D warnings
      - name: clippy (fuzz targets, all three)
        working-directory: fuzz
        run: cargo clippy --locked --bins --features testkdf -- -D warnings
      - name: cfg(miri) heap backend compiles (Miri itself runs in `sanitizers`)
        run: |
          cargo rustc --locked --lib --profile check -- --cfg miri -D warnings
          cargo rustc --locked --lib --profile check --features memtest -- --cfg miri -D warnings
          cargo rustc --locked --test format --profile check --no-default-features -- --cfg miri -D warnings
          cargo rustc --locked --test crypto --profile check --no-default-features --features testkdf -- --cfg miri -D warnings
      - name: T-ENG-2, T-ENG-3, T-ENG-4 (source scanners)
        run: cargo test --locked --test eng
      - name: Install tokei
        run: cargo install --locked tokei --version "$TOKEI_VERSION"
      - name: T-ENG-6 LOC budget
        run: python3 -I scripts/loc_budget.py src

  test:
    # M1 gate: T-MEM-1, T-MEM-2, T-MEM-3, T-MEM-5 (release), T-MEM-6, T-ENG-5.
    # M2 gate: T-FMT-1 .. T-FMT-4. M3 gate: T-KAT-1, T-KAT-2, T-CRY-1 ..
    # T-CRY-6, T-COMPAT-1 (tests/crypto.rs), T-MEM-7 (tests/kdf_region.rs).
    # M4 gate (every configuration below): T-STORE-2 (fault injection, lib
    # unit test in src/store.rs), T-STORE-1, -3 (500 kills), -4, -5, -6, -7,
    # -9 (tests/store.rs), T-FMT-4 incl. the store read path
    # (tests/format_alloc.rs). Vaults live under $TMPDIR (the runner's ext4
    # root disk, so fsync is real); the source tree is never used.
    # Needs RLIMIT_MEMLOCK >= 2 MiB (GitHub runners: 8 MiB) and a non-root user
    # for T-MEM-5's ptrace / /proc/<pid>/mem refusal and for the RLIMIT_MEMLOCK
    # = 0 child of the --require-locked-kdf test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug, default features (T-MEM-1, T-MEM-5 debug, T-MEM-6, T-ENG-5)
        run: cargo test --locked
      - name: Debug, memtest (T-MEM-2, T-MEM-3)
        run: cargo test --locked --features memtest
      - name: Release (T-MEM-5 against the release binary)
        run: cargo test --locked --release
      - name: Debug, testkdf (T-FMT-*; T-COMPAT-1 and T-CRY-1 on the golden vaults)
        run: cargo test --locked --features testkdf
      - name: Debug, memtest + testkdf (T-MEM-7 zero-before-munmap on a locked region)
        run: cargo test --locked --features memtest,testkdf
      - name: T-STORE-1 on a real foreign filesystem (vfat loop mount)
        # Refused without --allow-foreign-fs; with it, the full save protocol
        # runs, including the copy fallback (vfat has no hard links). The
        # mount reports our UID and 0700/0600, as the override requires.
        run: |
          command -v mkfs.vfat || { sudo apt-get update && sudo apt-get install -y dosfstools; }
          truncate -s 64M "$RUNNER_TEMP/vfat.img"
          mkfs.vfat "$RUNNER_TEMP/vfat.img"
          sudo mkdir -p /mnt/pwv-vfat
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)",umask=077 "$RUNNER_TEMP/vfat.img" /mnt/pwv-vfat
          stat -f -c 'filesystem: %T (magic 0x%t)' /mnt/pwv-vfat
          PWV_FOREIGN_DIR=/mnt/pwv-vfat cargo test --locked --test store \
            -- --exact t_store_1_foreign_fs_real_mount 2>&1 | tee out.txt
          grep -q "test result: ok. 1 passed" out.txt

  compat:
    # T-COMPAT-1, independent half: the golden vaults decrypt to the manifest
    # models with argon2-cffi + PyNaCl (libsodium), sharing no code with pwv.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reference implementations
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install \
            "argon2-cffi==$PY_ARGON2_CFFI_VERSION" "pynacl==$PY_PYNACL_VERSION"
      - name: Golden vaults decrypt independently
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/verify_golden.py tests/vectors'
      - name: Negative control (a flipped ciphertext byte must fail the check)
        run: |
          cp -r tests/vectors "$RUNNER_TEMP/bad"
          python3 -I -c 'import sys; p=sys.argv[1]; b=bytearray(open(p,"rb").read()); b[300]^=1; open(p,"wb").write(b)' \
            "$RUNNER_TEMP/bad/v1-small.pwv"
          if "$RUNNER_TEMP/venv/bin/python" -I scripts/verify_golden.py "$RUNNER_TEMP/bad" > out.txt; then
            echo "verifier accepted a tampered vault"; exit 1
          fi
          cat out.txt
          grep -q "FAIL: v1-small.pwv: authentication failed" out.txt

  fuzz-smoke:
    # T-FUZZ-1, T-FUZZ-2 (M2), T-FUZZ-3 (M3; with `testkdf`): 60 s per
    # target, ASan, on every push.
    # Invariants (Section 14.10): no panic, no allocation above 64 MiB,
    # no input slower than 1 s, round-trip identity (asserted in-target).
    runs-on: ubuntu-latest
    env:
      # ASan's quarantine keeps freed blocks resident (256 MiB by default on
      # x86_64), and libFuzzer's -rss_limit_mb counts them, so a target that
      # allocates per input (fuzz_body's output buffer) hits the 256 MiB limit
      # without any leak. Cap the quarantine; -malloc_limit_mb still enforces
      # "no allocation above 64 MiB". DESIGN_NOTES.md, 2026-11-11.
      ASAN_OPTIONS: quarantine_size_mb=32:detect_leaks=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: fuzz_header, features: "" }
          - { target: fuzz_body, features: "" }
          - { target: fuzz_open, features: "--features testkdf" }
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"
      - name: Fuzz ${{ matrix.target }} for 60 s
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          cargo +nightly fuzz run ${{ matrix.features }} ${{ matrix.target }} "$RUNNER_TEMP/corpus" \
            fuzz/corpus/${{ matrix.target }} -- \
            -max_total_time=60 -rss_limit_mb=256 -malloc_limit_mb=64 \
            -timeout=1 -max_len=24576
      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  sanitizers:
    # T-SAN-2: Miri on `format` (M2) and on the M3 code (`crypto`, the
    # `vault` lifecycle, the `KdfRegion` cast in `secmem`). Every push and
    # nightly. One job per suite, in parallel, each with the 6 h job limit;
    # --report-time names any slow test. T-SAN-1 (ASan) is added in M9.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            args: "--no-default-features --test format -- --skip t_fmt_2_entry_count"
          - name: format-10000-entries
            args: "--no-default-features --test format -- --exact t_fmt_2_entry_count_0_max_max_plus_1"
          - name: format-testkdf
            args: "--no-default-features --features testkdf --test format --"
          # Native runs cover the heavy sweeps (T-CRY-1, -3, -5), the 6 MiB
          # capacity case, file I/O, and child processes (Miri isolation).
          - name: crypto-vault
            args: >-
              --no-default-features --features testkdf --test crypto --
              t_kat_ normalize_ kdf_write_policy ct_eq_and_wrap lifecycle_
              t_cry_2_ t_cry_4_ t_cry_6_ unlock_rejects_
    name: sanitizers (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          cargo +nightly miri setup
      - name: T-SAN-2 Miri (${{ matrix.name }})
        run: >-
          cargo +nightly miri test --locked ${{ matrix.args }}
          -Zunstable-options --report-time

  durability:
    # T-STORE-3 at the nightly size of Section 15.3 (5,000 SIGKILLs at a
    # uniform 0-50 ms into the save loop), on every push and daily, against
    # the runner's ext4 disk. T-STORE-8 (LazyFS) is added in M9.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: T-STORE-3 kill loop, 5,000 iterations (release)
        env:
          PWV_T_STORE_3_ITERATIONS: "5000"
        run: cargo test --locked --release --test store -- --exact t_store_3_kill_loop

  coredump:
    # T-MEM-5, "no core file and no coredumpctl entry", on the host the owner
    # decision assumes (DESIGN_NOTES.md: suid_dumpable = 0) with
    # systemd-coredump as the piped core_pattern. A positive control first
    # proves that a crash of a dumpable process does produce an entry here,
    # so the negative check is not vacuous.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install systemd-coredump; set suid_dumpable = 0
        run: |
          sudo systemctl disable --now apport.service 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y systemd-coredump
          sudo sysctl -p /usr/lib/sysctl.d/50-coredump.conf
          sudo sysctl -w fs.suid_dumpable=0
          sudo systemctl start systemd-coredump.socket
          sysctl kernel.core_pattern fs.suid_dumpable
          case "$(sysctl -n kernel.core_pattern)" in
            *systemd-coredump*) ;;
            *) echo "core_pattern is not systemd-coredump"; exit 1 ;;
          esac
      - name: Positive control (a dumpable crash is recorded)
        run: |
          cp /bin/sleep "$RUNNER_TEMP/pwvctl"
          ulimit -c unlimited
          "$RUNNER_TEMP/pwvctl" 60 & pid=$!
          sleep 1; kill -SEGV "$pid"; wait "$pid" || true
          for _ in $(seq 30); do
            coredumpctl --no-pager list pwvctl && exit 0
            sleep 1
          done
          echo "systemd-coredump recorded nothing; the check below would be vacuous"
          exit 1
      - name: Build release tests
        run: cargo test --locked --release --test harden --no-run
      - name: T-MEM-5 (release)
        run: cargo test --locked --release --test harden t_mem_5
      - name: No coredumpctl entry for pwv
        run: |
          sleep 10 # systemd-coredump processes crashes asynchronously
          if coredumpctl --no-pager list pwv; then
            echo "T-MEM-5: coredumpctl has an entry for pwv"
            exit 1
          fi
          coredumpctl --no-pager list || true

  supply:
    # T-SUPPLY-1.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
      - name: cargo deny (advisories, bans, licenses, sources)
        run: cargo deny --locked check
      - name: cargo audit
        run: cargo audit --deny warnings
