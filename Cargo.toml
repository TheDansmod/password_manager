[package]
name = "pwv"
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.99"
description = "Single-binary, Linux-first terminal password manager"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pwv"
path = "src/main.rs"

# Runtime dependencies: exactly the set of spec Section 3. Versions are pinned
# exactly in Cargo.lock; builds use --locked.
[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
zeroize = "1.9.1"
getrandom = "0.4.3"
rustix = { version = "1.1.6", features = ["event", "fs", "mm", "param", "process", "stdio", "termios"] }
# libc: only for calls rustix lacks (sigaction); used inside `sys` only.
libc = "0.2.191"
unicode-normalization = "0.1.26"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"], optional = true }

[dev-dependencies]
expectrl = "0.9.0"
proptest = "1.12.0"
rand_chacha = "0.10.0"
sha2 = "0.11.1"
static_assertions = "1.1.0"
tempfile = "3.27.0"
# T-CLIP-4's mock clipboard manager (tests/clip.rs). Already in the graph
# through arboard, at this exact version.
x11rb = "0.13.2"

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]
# Test-only (Section 5.8). Never enabled in release artefacts (T-ENG-7).
memtest = []
# Test-only (Section 6.4). Never enabled in release artefacts (T-ENG-7).
testkdf = []

# `cfg(coverage)` is set by `cargo llvm-cov` (spec 14.13); only the T-MEM-2
# probe child uses it (tests/secmem.rs), to write its profile before SIGSEGV.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
overflow-checks = true
debug = false
strip = "symbols"

[profile.dev]
panic = "unwind"

# Tests only: optimise dependencies (Argon2, ChaCha20, proptest) in dev and
# test builds so KDF-heavy tests run in seconds. pwv itself stays at
# opt-level 0 with debug assertions. Release builds are unaffected.
[profile.dev.package."*"]
opt-level = 3
